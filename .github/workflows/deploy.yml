name: Deploy to GitHub Pages

# Builds the site and publishes it to GitHub Pages on every push to main.
# This replaces the Netlify auto-deploy flow: push to main -> this workflow
# runs -> live site updates, no manual steps needed on an ongoing basis.
#
# One-time setup required in the GitHub UI before this works:
#   Repo -> Settings -> Pages -> "Build and deployment" -> Source -> set to
#   "GitHub Actions" (not "Deploy from a branch").

on:
  push:
    branches: [main]
  # Lets you manually trigger a redeploy from the Actions tab without
  # needing a new commit (Actions tab -> Deploy to GitHub Pages -> Run workflow).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-progress one
# rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Add SPA fallback (client-side routes like /book, /services)
        # GitHub Pages has no server-side rewrite rules (unlike Netlify/
        # Vercel), so a direct link or refresh on a route like bizlegate.com
        # /book would 404. Serving the same app shell as 404.html lets
        # React Router take over and render the right page client-side.
        run: cp dist/index.html dist/404.html

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
